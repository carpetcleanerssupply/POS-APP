name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_PRISMA_URL: postgresql://pos:pos@localhost:5432/pos_test
      POSTGRES_URL_NON_POOLING: postgresql://pos:pos@localhost:5432/pos_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run build

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && exit 0
            sleep 2
          done
          echo "Server did not become ready in time" >&2
          exit 1

      - run: npm test
